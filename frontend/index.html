<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM 监控工作台</title>
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('llm-monitor-theme'); } catch (error) { stored = null; }
    if (stored !== 'light' && stored !== 'dark') {
      stored = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = stored;
  })();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot" id="conn-dot"></span>
    <h1>LLM 监控工作台</h1>
    <span class="version" id="version"></span>
    <span class="tip" tabindex="0" data-tip="推理指标来自 llama-server 的 /metrics、/slots、/props（router 模式会逐个 loaded 模型拉取）；显卡指标来自 nvidia-smi；系统指标来自 Win32 API。曲线可以悬停取值，每张卡片右侧的 i 是该项口径说明，鼠标停在采样时间上可以看各阶段耗时。">i</span>
  </div>
  <div class="topbar-right">
    <!-- 功耗档位切换（2026-10-19 从系统区块上移到顶栏，更新时间左边）：
         读瓦数看功耗卡，换档在这里；读不到显卡时整行不渲染，顶栏自动收起。 -->
    <div id="power-control" class="power-control top"></div>
    <span class="muted" id="meta">正在连接…</span>
    <button id="theme-btn" type="button">深色</button>
    <button id="restart-btn" type="button">重启</button>
  </div>
</header>

<main>
  <section class="block" data-accent="d">
    <!-- 系统信息标题取消（2026-10-19）；档位开关同日挪去顶栏后，
         这个 block-head 已经没有住户，整行删除。 -->
    <div id="sys" class="grid compact"></div>
  </section>

  <section class="block" data-accent="a" id="model-info">
    <div class="block-head">
      <h2>模型信息</h2>
      <div class="head-extra">
        <div id="token-stats" class="head-stats"></div>
        <div id="endpoint-sources" class="src-row head"></div>
      </div>
    </div>
    <div id="endpoints" class="endpoint-list"></div>
  </section>

  <section class="block" data-accent="t">
    <div class="block-head">
      <h2>历史信息 <span class="tip" tabindex="0" data-tip="llama-server 只把 token 数报成进程生命周期内的累计值，server 重启或 router 卸载模型都会归零。工作台每轮采样把增量折进 stats.json，并连上一次读到的原始计数值一起保存，所以面板自己重启也能接着往下算；面板第一次见到某个模型时，会把它当时已有的累计值整体计入，否则那部分就永远丢了。『今日』按本机日期切分；预填充只统计实际参与计算的 token，走 KV 缓存复用的单独计；数值悬停可看精确值。">i</span></h2>
      <button id="stats-reset-btn" type="button" class="danger" title="把账本整体归零：今日与累计 token、模型排行、功率档归集、明细表、近 7 天汇总全部清空，并当场写回 stats.json。引擎计数基线会保留，所以清空后不会把 server 的历史累计重新入账；此操作不可撤销。">清空数据</button>
    </div>
    <div id="token-note" class="stat-note"></div>

    <details class="collapsible" data-tone="a">
      <summary>
        <h3>模型排行 TOP 3 <span class="tip" tabindex="0" data-tip="按账本里每个模型的累计值排名。『输出最多』看累计生成的 token 总数；『输出速度』看引擎自计时口径下的平均生成速率（token ÷ 引擎解码耗时，空闲时间不计入分母），只统计有实测耗时的模型。两者都是自面板开始记账以来的累计值，server 重启不会清零。">i</span></h3>
      </summary>
      <div class="rank-grid">
        <div id="token-rank-output" class="subtable"></div>
        <div id="token-rank-speed" class="subtable"></div>
      </div>
    </details>

    <details id="token-tiers-section" class="collapsible" data-tone="f">
      <summary>
        <h3>按功率 <span class="tip" tabindex="0" data-tip="token 增量在记账的那一刻会被打上当时生效的显卡功耗上限，所以这里回答的是『这些 token 是在哪个功率档下跑出来的』。注意这是按时间归因，不是按用量分摊——功耗上限属于整张显卡，同一张卡上同时跑的几个模型都会记到同一个档位，这个数永远不代表某个模型『用掉了多少瓦』。档位归集从本功能启用那一刻开始记，更早的 token 没有记录当时的档位，所以各档之和小于累计总量；采样时读不到功耗上限（显卡采集关闭或驱动查询失败）会单独记成『档位未知』，不会被并进任何一档。">i</span></h3>
        <span class="muted" id="token-tier-summary"></span>
      </summary>
      <div id="token-tiers" class="tier-grid"></div>
      <div id="token-tier-note" class="stat-note subtle"></div>
    </details>

    <details class="collapsible" data-tone="e">
      <summary>
        <h3>明细 <span class="tip" tabindex="0" data-tip="逐行累计每个『某天 + 某档位 + 某模型』组合的增量。速度用的是引擎自己上报的耗时（llama.cpp 的 prompt_seconds / predicted_seconds 计数器），只在引擎真正计算时增长，所以空闲时间不会把速率摊薄——它反映的是『干活时有多快』。注意预填充速率的分子含 KV 缓存命中的 token，而缓存重读几乎不花时间，所以命中越多这个数越大；对照『KV 复用』一列看，它接近预填充量时说明大部分提示词只是重读缓存而不是真在算。某个组合的耗时计数为 0（例如模型刚加载、该 series 还没导出）时显示为 —。">i</span></h3>
      </summary>
      <div id="token-combos" class="subtable"></div>
    </details>

    <details class="collapsible" data-tone="b">
      <summary>
        <h3>近 7 天汇总</h3>
      </summary>
      <div id="token-days" class="subtable"></div>
    </details>
  </section>
</main>

<script>
  window.addEventListener('error', function (event) {
    var box = document.getElementById('meta');
    if (box) box.textContent = '脚本错误：' + (event.message || event.type);
  });
</script>
<script src="/app.js"></script>
</body>
</html>
